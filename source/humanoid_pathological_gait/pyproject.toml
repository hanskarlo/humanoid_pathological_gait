[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid_pathological_gait"
version = "0.1.0"
description = "Isaac Lab environment for 19-DoF Unitree H1 post-stroke (pathological) gait imitation."
license = { text = "BSD-3-Clause" }
authors = [{ name = "Hans Karlo Jarales", email = "jarales@ualberta.ca" }]
keywords = ["isaac-lab", "isaac-sim", "reinforcement-learning", "biomechanics", "gait", "humanoid"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim,rsl-rl]",
]

[project.entry-points."isaaclab.tasks"]
"humanoid_pathological_gait" = "humanoid_pathological_gait.tasks"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["humanoid_pathological_gait", "humanoid_pathological_gait.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml", "*.usd", "*.yaml", "*.yml", "*.npz"]
